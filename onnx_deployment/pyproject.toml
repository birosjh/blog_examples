[project]
name = "onnx-example"
version = "0.1.0"
description = "A simple onnx export and import example"
authors = [
    {name = "Jacob Biros"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch (>=2.7.1,<3.0.0)",
    "lightning (>=2.5.2,<3.0.0)",
    "opencv-python (>=4.11.0.86,<5.0.0.0)",
    "onnxconverter-common (>=1.14.0,<2.0.0)",
    "timm (>=1.0.16,<2.0.0)",
    "onnxruntime (>=1.22.0,<2.0.0)",
    "torchmetrics (>=1.7.3,<2.0.0)"
]

[tool.poetry]

[tool.poetry.group.dev.dependencies]
ruff = "^0.12.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
